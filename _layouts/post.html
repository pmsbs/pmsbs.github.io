---
layout: 'layout'
---
{% assign author = site.data.authors[page.author] %}

<header class="header">
  <div class="container header__inner">
    <h1 class="header__title">{{ page.title }}</h1>
    <p>{{ page.excerpt }}</p>
    <p>Publicado em {{ page.date | date: "%d/%m/%Y" }} por {{ author.author }} em {{ page.categories | join: ", " }}</p>
  </div>
</header>

<div class="container page__inner">
  <article class="post">
    {{content}}
  </article>

  {% include categories.html %}
</div>
