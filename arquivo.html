---
layout: default
title: "Arquivo"
---
{% for category in site.categories %}
  {% capture category_name %}{{ category | first }}{% endcapture %}
  <h2>{{ category_name }}</h2>
  <ul>
    {% for post in site.categories[category_name] %}
      <li>
        <a href="{{ post.url }}">{{ post.title }}</a>
      </li>
    {% endfor %}
  </ul>
{% endfor %}
